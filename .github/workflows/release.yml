name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test
        run: .\build\Release\leveler_selftest.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\LevelerFree_artefacts\Release\VST3\Leveler Free.vst3" -DestinationPath "LevelerFree_VST3-win-x64.zip"
          Compress-Archive -Path "build\LevelerPro_artefacts\Release\VST3\Leveler Pro.vst3" -DestinationPath "LevelerPro_VST3-win-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leveler-vst3-win-x64
          path: |
            LevelerFree_VST3-win-x64.zip
            LevelerPro_VST3-win-x64.zip

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LevelerFree_VST3-win-x64.zip
            LevelerPro_VST3-win-x64.zip
